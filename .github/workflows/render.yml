# Cloud render farm: renders a composition in parallel chunks on GitHub's free runners, joins the chunks into one MP4
# (optionally with the soundtrack), checks it, and uploads it as a downloadable artifact. No local install needed.
#
# Start a render, either:
#   1. edit render-request.json (composition / chunks / preview / audio) and commit it — any branch; or
#   2. GitHub → Actions → "Render video" → Run workflow (available once this file is on the default branch).
# Download: open the finished run → "Artifacts" at the bottom → the video zip.
name: Render video

on:
  push:
    paths: [render-request.json]
  workflow_dispatch:
    inputs:
      composition: { description: "Composition ID (e.g. BridgeShort)", required: true, default: "BridgeShort" }
      chunks: { description: "Parallel chunks (1-20)", required: true, default: "15" }
      preview: { description: "Half-size preview (540x960) instead of full 1080x1920", type: boolean, default: false }
      audio: { description: "Soundtrack path in the repo (optional, e.g. videos/x/audio/mix.wav)", required: false, default: "" }

permissions:
  contents: write   # publish finished videos as GitHub Releases
  actions: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

env:
  # GitHub runners have no real GPU (they expose a /dev/dri device that WebGL can't use): render on the CPU.
  REMOTION_GL: swangle

defaults:
  run:
    working-directory: animation-studio

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      composition: ${{ steps.req.outputs.composition }}
      preview: ${{ steps.req.outputs.preview }}
      audio: ${{ steps.req.outputs.audio }}
      reuse: ${{ steps.req.outputs.reuse }}
      publish: ${{ steps.req.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
      width: ${{ steps.plan.outputs.width }}
      height: ${{ steps.plan.outputs.height }}
    steps:
      - uses: actions/checkout@v4
      - id: req
        name: Read render request
        working-directory: .
        env:
          IN_COMP: ${{ inputs.composition }}
          IN_CHUNKS: ${{ inputs.chunks }}
          IN_PREVIEW: ${{ inputs.preview }}
          IN_AUDIO: ${{ inputs.audio }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMP="$IN_COMP"; CHUNKS="$IN_CHUNKS"; PREVIEW="$IN_PREVIEW"; AUDIO="$IN_AUDIO"
          else
            COMP=$(jq -r '.composition' render-request.json); CHUNKS=$(jq -r '.chunks // 15' render-request.json)
            PREVIEW=$(jq -r '.preview // false' render-request.json); AUDIO=$(jq -r '.audio // ""' render-request.json)
            # optional: render only frames FROM.. (earlier frames come as finished chunks committed in REUSE), and
            # publish=false to skip the GitHub Release (the video stays a downloadable run artifact)
            FROM=$(jq -r '.from // 0' render-request.json); REUSE=$(jq -r '.reuse // ""' render-request.json)
            PUBLISH=$(jq -r 'if .publish == false then "false" else "true" end' render-request.json)
          fi
          FROM=${FROM:-0}; PUBLISH=${PUBLISH:-true}
          [[ "$FROM" =~ ^[0-9]+$ ]] || { echo "bad from"; exit 1; }
          [[ -z "$REUSE" || ( "$REUSE" =~ ^[A-Za-z0-9_./-]+$ && -d "$REUSE" ) ]] || { echo "bad reuse dir"; exit 1; }
          # default soundtrack location if none given
          if [ -z "$AUDIO" ]; then for f in "animation-studio/audio/$COMP.wav" "animation-studio/audio/$COMP.mp3"; do [ -f "$f" ] && AUDIO="$f"; done; fi
          [[ "$COMP" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad composition id"; exit 1; }
          # a storyboard Short is never rendered or published without its narrated soundtrack
          if [[ "$COMP" == Short-* && -z "$AUDIO" ]]; then echo "::error::$COMP has no soundtrack (animation-studio/audio/$COMP.mp3): run npm run voice first"; exit 1; fi
          if [[ "$COMP" == Short-* && "$AUDIO" != "animation-studio/audio/$COMP.mp3" ]]; then echo "::error::$COMP must use its own fingerprinted soundtrack animation-studio/audio/$COMP.mp3, not '$AUDIO'"; exit 1; fi
          echo "composition=$COMP" >> "$GITHUB_OUTPUT"; echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"; echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"; echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"; echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Render $COMP, $CHUNKS chunks, preview=$PREVIEW, audio='$AUDIO'"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - run: npx tsc --noEmit
      # storyboard Shorts: validation + narration complete + soundtrack present and built from THIS storyboard
      - name: Preflight (storyboard, narration, soundtrack)
        run: npm run preflight -- "${{ steps.req.outputs.composition }}"
      - run: npx remotion browser ensure
      - run: npx remotion bundle --out-dir build --log warn
      - id: plan
        name: Plan chunks
        run: |
          P=$(node scripts/plan-chunks.mjs "${{ steps.req.outputs.composition }}" "${{ steps.req.outputs.chunks }}" build | tail -1)
          echo "$P"
          FROM=${{ steps.req.outputs.from }}; N=${{ steps.req.outputs.chunks }}
          if [ "$FROM" -gt 0 ]; then
            # only frames FROM..total-1, numbered from 100 so they sort after the reused chunks
            P=$(echo "$P" | jq -c --argjson f "$FROM" --argjson n "$N" '.total as $t | .chunks = [range(0; $n) as $j | {i: (100 + $j), frames: "\(($f + (($t - $f) * $j / $n | floor)))-\(($f + (($t - $f) * ($j + 1) / $n | floor) - 1))"}]')
            echo "$P"
          fi
          echo "matrix=$(echo "$P" | jq -c '.chunks')" >> "$GITHUB_OUTPUT"
          echo "total=$(echo "$P" | jq -r '.total')" >> "$GITHUB_OUTPUT"
          W=$(echo "$P" | jq -r '.width'); H=$(echo "$P" | jq -r '.height')
          # expected output size (a preview renders at half size)
          if [ "${{ steps.req.outputs.preview }}" = "true" ]; then W=$((W / 2)); H=$((H / 2)); fi
          echo "width=$W" >> "$GITHUB_OUTPUT"; echo "height=$H" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: render ${{ matrix.chunk.frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - run: npx remotion browser ensure
      - name: Render chunk
        run: |
          PART=$(printf "out/parts/part_%03d.mp4" ${{ matrix.chunk.i }})
          node scripts/render.mjs "${{ needs.plan.outputs.composition }}" --frames "${{ matrix.chunk.frames }}" --out "$PART" \
            ${{ needs.plan.outputs.preview == 'true' && '--preview' || '' }} 2>&1 | grep -v -E "Failed to load resource|swiftshader|^Rendered|^Encoded"
          test -f "$PART"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.i }}
          path: animation-studio/out/parts/
          retention-days: 2

  join:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, merge-multiple: true, path: animation-studio/out/parts }
      - name: Join chunks (+ soundtrack)
        id: join
        run: |
          COMP="${{ needs.plan.outputs.composition }}"
          SUFFIX=$([ "${{ needs.plan.outputs.preview }}" = "true" ] && echo "_preview" || echo "")
          OUT="out/final/${COMP}${SUFFIX}.mp4"
          mkdir -p out/final
          REUSE="${{ needs.plan.outputs.reuse }}"
          if [ -n "$REUSE" ]; then cp "../$REUSE"/part_*.mp4 out/parts/; echo "reused: $(ls ../$REUSE/part_*.mp4 | wc -l) chunks from $REUSE"; fi
          ls out/parts/
          AUDIO_ARGS=()
          if [ -n "${{ needs.plan.outputs.audio }}" ]; then AUDIO_ARGS=(--audio "../${{ needs.plan.outputs.audio }}"); fi
          node scripts/concat.mjs "$OUT" $(ls out/parts/part_*.mp4 | sort) "${AUDIO_ARGS[@]}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"; echo "name=${COMP}${SUFFIX}-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.join.outputs.name }}
          path: animation-studio/${{ steps.join.outputs.out }}
          retention-days: 30
          compression-level: 0
      - name: Quality check + publish
        uses: ./.github/actions/qa-publish
        with:
          video: animation-studio/${{ steps.join.outputs.out }}
          frames: ${{ needs.plan.outputs.total }}
          width: ${{ needs.plan.outputs.width }}
          height: ${{ needs.plan.outputs.height }}
          audio: ${{ needs.plan.outputs.audio != '' && 'required' || 'none' }}
          tag: video-${{ steps.join.outputs.name }}
          publish: ${{ needs.plan.outputs.publish }}
          title: "${{ steps.join.outputs.name }}"
          notes: "Composition **${{ needs.plan.outputs.composition }}**, ${{ needs.plan.outputs.preview == 'true' && 'half-size preview' || 'full quality' }}, soundtrack: `${{ needs.plan.outputs.audio || 'none' }}`."
