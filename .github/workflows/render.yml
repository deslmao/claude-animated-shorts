# Cloud render farm: renders a composition in parallel chunks on GitHub's free runners, joins the chunks into one MP4
# (optionally with the soundtrack), checks it, and uploads it as a downloadable artifact. No local install needed.
#
# Start a render, either:
#   1. edit render-request.json (composition / chunks / preview / audio) and commit it — any branch; or
#   2. GitHub → Actions → "Render video" → Run workflow (available once this file is on the default branch).
# Download: open the finished run → "Artifacts" at the bottom → the video zip.
name: Render video

on:
  push:
    paths: [render-request.json]
  workflow_dispatch:
    inputs:
      composition: { description: "Composition ID (e.g. BridgeShort)", required: true, default: "BridgeShort" }
      chunks: { description: "Parallel chunks (1-20)", required: true, default: "15" }
      preview: { description: "Half-size preview (540x960) instead of full 1080x1920", type: boolean, default: false }
      audio: { description: "Soundtrack path in the repo (optional, e.g. videos/x/audio/mix.wav)", required: false, default: "" }

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: animation-studio

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      composition: ${{ steps.req.outputs.composition }}
      preview: ${{ steps.req.outputs.preview }}
      audio: ${{ steps.req.outputs.audio }}
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - id: req
        name: Read render request
        working-directory: .
        env:
          IN_COMP: ${{ inputs.composition }}
          IN_CHUNKS: ${{ inputs.chunks }}
          IN_PREVIEW: ${{ inputs.preview }}
          IN_AUDIO: ${{ inputs.audio }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMP="$IN_COMP"; CHUNKS="$IN_CHUNKS"; PREVIEW="$IN_PREVIEW"; AUDIO="$IN_AUDIO"
          else
            COMP=$(jq -r '.composition' render-request.json); CHUNKS=$(jq -r '.chunks // 15' render-request.json)
            PREVIEW=$(jq -r '.preview // false' render-request.json); AUDIO=$(jq -r '.audio // ""' render-request.json)
          fi
          # default soundtrack location if none given
          if [ -z "$AUDIO" ]; then for f in "animation-studio/audio/$COMP.wav" "animation-studio/audio/$COMP.mp3"; do [ -f "$f" ] && AUDIO="$f"; done; fi
          [[ "$COMP" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "bad composition id"; exit 1; }
          echo "composition=$COMP" >> "$GITHUB_OUTPUT"; echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "preview=$PREVIEW" >> "$GITHUB_OUTPUT"; echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"
          echo "Render $COMP, $CHUNKS chunks, preview=$PREVIEW, audio='$AUDIO'"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - run: npx tsc --noEmit
      - run: npx remotion browser ensure
      - run: npx remotion bundle --out-dir build --log warn
      - id: plan
        name: Plan chunks
        run: |
          P=$(node scripts/plan-chunks.mjs "${{ steps.req.outputs.composition }}" "${{ steps.req.outputs.chunks }}" build | tail -1)
          echo "$P"
          echo "matrix=$(echo "$P" | jq -c '.chunks')" >> "$GITHUB_OUTPUT"
          echo "total=$(echo "$P" | jq -r '.total')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: render ${{ matrix.chunk.frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - run: npx remotion browser ensure
      - name: Render chunk
        run: |
          PART=$(printf "out/parts/part_%03d.mp4" ${{ matrix.chunk.i }})
          node scripts/render.mjs "${{ needs.plan.outputs.composition }}" --frames "${{ matrix.chunk.frames }}" --out "$PART" \
            ${{ needs.plan.outputs.preview == 'true' && '--preview' || '' }} 2>&1 | grep -v -E "Failed to load resource|swiftshader|^Rendered|^Encoded"
          test -f "$PART"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.i }}
          path: animation-studio/out/parts/
          retention-days: 2

  join:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: animation-studio/package-lock.json }
      - run: npm ci --no-fund --no-audit --loglevel=error
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, merge-multiple: true, path: animation-studio/out/parts }
      - name: Join chunks (+ soundtrack)
        id: join
        run: |
          COMP="${{ needs.plan.outputs.composition }}"
          SUFFIX=$([ "${{ needs.plan.outputs.preview }}" = "true" ] && echo "_preview" || echo "")
          OUT="out/final/${COMP}${SUFFIX}.mp4"
          mkdir -p out/final
          AUDIO_ARGS=()
          if [ -n "${{ needs.plan.outputs.audio }}" ]; then AUDIO_ARGS=(--audio "../${{ needs.plan.outputs.audio }}"); fi
          node scripts/concat.mjs "$OUT" $(ls out/parts/part_*.mp4 | sort) "${AUDIO_ARGS[@]}"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"; echo "name=${COMP}${SUFFIX}-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Check the video
        run: |
          OUT="${{ steps.join.outputs.out }}"
          N=$(npx remotion ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$OUT")
          INFO=$(npx remotion ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -of compact "$OUT")
          echo "$INFO"; echo "frames: $N (expected ${{ needs.plan.outputs.total }})"
          {
            echo "## ${{ steps.join.outputs.name }}"
            echo '```'; echo "$INFO"; echo "frames: $N / ${{ needs.plan.outputs.total }}"; ls -la "$OUT"; echo '```'
            echo "Download it from **Artifacts** below."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$N" = "${{ needs.plan.outputs.total }}" ] || { echo "frame count mismatch"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.join.outputs.name }}
          path: animation-studio/${{ steps.join.outputs.out }}
          retention-days: 30
          compression-level: 0
